<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N Chat</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Auth Screen -->
    <div id="auth-screen" class="auth-container">
        <div class="auth-card">
            <h2><i class="fa-solid fa-comments"></i> N Chat</h2>
            <p>Connect with your network seamlessly.</p>
            <button id="google-login-btn" class="btn-primary">
                <i class="fa-brands fa-google"></i> Sign in with Google
            </button>
        </div>
    </div>

    <!-- Chat Screen -->
    <div id="chat-screen" class="chat-container hidden">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <img id="user-avatar" src="" alt="Avatar">
                    <span id="user-name">User</span>
                </div>
                <button id="logout-btn" title="Logout"><i class="fa-solid fa-right-from-bracket"></i></button>
            </div>
            <div class="sidebar-search">
                <input type="text" placeholder="Search chats...">
            </div>
            <div class="chat-list" id="chat-list">
                <!-- Dynamically populated chat list / rooms -->
                <div class="chat-item active">
                    <div class="chat-info">
                        <h4>Global Lounge</h4>
                        <p>General discussion room</p>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-main">
            <header class="chat-header">
                <h3 id="current-room-title">Global Lounge</h3>
                <span class="room-status"><i class="fa-solid fa-circle"></i> Online</span>
            </header>
            
            <div class="messages-container" id="messages-container">
                <!-- Messages will load here -->
            </div>

            <form id="message-form" class="message-input-form">
                <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off" required>
                <button type="submit" class="btn-send"><i class="fa-solid fa-paper-plane"></i></button>
            </form>
        </main>
    </div>

    <!-- Firebase SDK Scripts (Modular Version) -->
    <script type="module" src="app.js"></script>
</body>
</html>
