<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>N Chat - Mobile Auth</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --teal: #075E54;
    --teal-deep: #054C44;
    --marigold: #25D366;
    --bg: #ECE5DD;
    --panel: #FFFFFF;
    --border: #E2E7E2;
    --text: #1E2A28;
    --muted: #6B7A76;
    --online: #25D366;
  }

  [data-theme="dark"] {
    --teal: #1F2C34;
    --teal-deep: #111B21;
    --marigold: #00A884;
    --bg: #0B141A;
    --panel: #111B21;
    --border: #222D34;
    --text: #E9EDEF;
    --muted: #8696A0;
    --online: #00A884;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Hind Siliguri', sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    transition: background 0.3s, color 0.3s;
  }
  input, button, select { font-family: 'Hind Siliguri', sans-serif; }
  input:focus, select:focus { outline: 2px solid var(--teal); outline-offset: 1px; }
  button { cursor: pointer; -webkit-tap-highlight-color: transparent; }

  .screen { display: none; height: 100vh; height: 100dvh; flex-direction: column; }
  .screen.active { display: flex; }

  /* ---------- Auth screen ---------- */
  #authScreen { align-items: center; justify-content: center; background: linear-gradient(160deg, var(--teal) 0%, var(--teal-deep) 100%); padding: 24px; overflow-y: auto; }
  .auth-card { width: 100%; max-width: 360px; background: var(--panel); border-radius: 20px; padding: 32px 26px; box-shadow: 0 24px 50px -20px rgba(0,0,0,0.5); margin: 20px 0; }
  .auth-logo { font-family: 'Baloo Da 2', sans-serif; font-size: 32px; font-weight: 800; color: #25D366; text-align: center; margin-bottom: 4px; }
  .auth-sub { text-align: center; font-size: 13px; color: var(--muted); margin-bottom: 22px; }
  .field { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--border); font-size: 14px; margin-bottom: 10px; background: var(--bg); color: var(--text); }
  .btn-primary { width: 100%; padding: 12px 0; border-radius: 12px; border: none; background: #25D366; color: #fff; font-weight: 700; font-size: 15px; margin-top: 6px; }
  .btn-primary:hover { background: #20bd5a; }
  .auth-switch { text-align: center; font-size: 13px; color: var(--muted); margin-top: 16px; }
  .auth-switch a { color: #25D366; font-weight: 700; text-decoration: none; cursor: pointer; }
  .auth-error { color: #E53935; font-size: 12px; text-align: center; min-height: 16px; margin-bottom: 6px; }
  .photo-picker-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .photo-picker-preview { width: 52px; height: 52px; border-radius: 50%; background: var(--border); display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; border: 1.5px solid var(--border); }
  .photo-picker-preview img { width: 100%; height: 100%; object-fit: cover; }
  .photo-picker-btn { font-size: 12px; color: var(--teal); font-weight: 700; background: none; border: 1.5px solid var(--teal); padding: 6px 12px; border-radius: 10px; }

  /* ---------- Headers & Panels ---------- */
  #contactsScreen header, #chatScreen header, #settingsScreen header {
    background: var(--teal); color: #fff; padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12); position: relative;
  }
  .app-title { font-family: 'Baloo Da 2', sans-serif; font-weight: 700; font-size: 20px; color: #fff; }
  .header-actions { display: flex; align-items: center; gap: 8px; }
  .icon-btn { background: rgba(255,255,255,0.15); border: none; color: #fff; border-radius: 10px; padding: 8px 12px; font-size: 12px; font-weight: 600; }
  .contact-list { flex: 1; overflow-y: auto; padding: 0; background: var(--panel); }
  .contact-row { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--border); background: var(--panel); cursor: pointer; }
  .avatar-wrap { position: relative; flex-shrink: 0; }
  .avatar { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; color: #fff; overflow: hidden; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .online-dot { position: absolute; bottom: 0; right: 0; width: 13px; height: 13px; border-radius: 50%; background: var(--online); border: 2px solid var(--panel); }
  .contact-main { flex: 1; min-width: 0; }
  .contact-top-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .contact-name { font-weight: 600; font-size: 15px; color: var(--text); }
  .contact-phone { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .contact-time { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .contact-bottom-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 3px; }
  .contact-sub { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .unread-badge { background: #25D366; color: #fff; font-size: 11px; font-weight: 800; min-width: 20px; height: 20px; border-radius: 10px; display: flex; align-items: center; justify-content: center; padding: 0 5px; flex-shrink: 0; }
  .empty-state { text-align: center; color: var(--muted); font-size: 13px; padding: 60px 24px; }

  /* ---------- Three Dot Menu Styles ---------- */
  .menu-wrapper { position: relative; }
  .three-dot-btn { background: none; border: none; color: #fff; font-size: 22px; cursor: pointer; padding: 4px 8px; border-radius: 50%; }
  .three-dot-btn:hover { background: rgba(255,255,255,0.1); }
  .dropdown-menu {
    display: none; position: absolute; right: 0; top: 100%; background: var(--panel);
    border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 6px 18px rgba(0,0,0,0.15);
    width: 170px; z-index: 100; overflow: hidden; margin-top: 4px;
  }
  .dropdown-menu.show { display: block; }
  .dropdown-item {
    padding: 12px 16px; font-size: 14px; color: var(--text); cursor: pointer;
    display: flex; align-items: center; gap: 8px; transition: background 0.2s;
  }
  .dropdown-item:hover { background: var(--bg); }

  /* ---------- Settings screen ---------- */
  .settings-content { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .settings-card { width: 100%; max-width: 400px; background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .settings-card h3 { font-size: 16px; color: var(--teal); font-family: 'Baloo Da 2', sans-serif; }
  .settings-profile-center { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 6px; }
  .settings-avatar-preview { width: 80px; height: 80px; border-radius: 50%; background: var(--border); display: flex; align-items: center; justify-content: center; font-size: 28px; overflow: hidden; border: 2px solid var(--teal); }
  .settings-avatar-preview img { width: 100%; height: 100%; object-fit: cover; }
  .settings-label { font-size: 12.5px; font-weight: 600; color: var(--muted); }
  .settings-select, .settings-input { width: 100%; padding: 10px 14px; border-radius: 10px; border: 1.5px solid var(--border); background: var(--bg); color: var(--text); font-size: 14px; }

  /* ---------- Chat screen ---------- */
  #chatScreen header { gap: 10px; }
  .back-btn { background: none; border: none; color: #fff; font-size: 22px; padding: 0 4px; }
  .chat-header-info { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
  .chat-partner-name { font-family: 'Baloo Da 2', sans-serif; font-weight: 700; font-size: 16px; }
  .chat-partner-status { font-size: 11px; color: rgba(255,255,255,0.8); }
  .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 6px; background: var(--bg); }
  .msg-row { display: flex; align-items: center; gap: 6px; }
  .msg-row.mine { justify-content: flex-end; }
  .delete-msg-btn { background: none; border: none; font-size: 12px; opacity: 0.45; padding: 2px 4px; color: var(--text); }
  .bubble { max-width: 75%; padding: 8px 12px; border-radius: 12px; font-size: 14px; line-height: 1.4; position: relative; }
  .bubble.theirs { background: var(--panel); color: var(--text); border-top-left-radius: 0px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
  .bubble.mine { background: #E7FCE3; color: #111; border-top-right-radius: 0px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
  [data-theme="dark"] .bubble.mine { background: #005C4B; color: #E9EDEF; }
  .bubble img { max-width: 100%; border-radius: 8px; display: block; margin-top: 4px; }
  .bubble .meta-row { display: flex; align-items: center; justify-content: flex-end; gap: 3px; margin-top: 2px; }
  .bubble .time { font-size: 10px; opacity: 0.6; }
  .bubble .ticks { font-size: 11px; margin-left: 2px; }
  .bubble .ticks.seen { color: #34B7F1; }
  .typing-indicator { font-size: 12px; color: var(--muted); padding: 4px 16px; font-style: italic; background: var(--panel); }
  .composer { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: var(--panel); border-top: 1px solid var(--border); flex-shrink: 0; }
  .composer input[type="text"] { flex: 1; border: 1.5px solid var(--border); border-radius: 22px; padding: 10px 16px; font-size: 14px; background: var(--bg); color: var(--text); }
  .round-btn { width: 40px; height: 40px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 16px; }
  .round-btn.img { background: var(--border); color: var(--text); }
  .round-btn.send { background: #00A884; color: #fff; }
  #imageInput, #photoInput, #settingsPhotoInput { display: none; }
  .img-preview-bar { padding: 8px 14px; background: var(--panel); border-top: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
  .img-preview-bar img { width: 44px; height: 44px; object-fit: cover; border-radius: 8px; }
</style>
</head>
<body onclick="closeDropdowns(event)">

<!-- ================= AUTH SCREEN ================= -->
<div class="screen active" id="authScreen">
  <div class="auth-card">
    <div class="auth-logo">WhatsApp Chat</div>
    <div class="auth-sub" id="authSubLabel">মোবাইল নাম্বার দিয়ে চ্যাট শুরু করুন</div>
    <div class="auth-error" id="authError"></div>
    <input class="field" id="displayNameField" placeholder="আপনার নাম" style="display:none;" />
    <div class="photo-picker-row" id="photoPickerRow" style="display:none;">
      <div class="photo-picker-preview" id="signupPhotoPreview">📷</div>
      <button type="button" class="photo-picker-btn" onclick="document.getElementById('photoInput').click()">প্রোফাইল ছবি (ঐচ্ছিক)</button>

    <div class="auth-switch" id="authSwitchLabel">অ্যাকাউন্ট নেই? <a onclick="toggleAuthMode()">নতুন একাউন্ট খুলুন</a></div>
  </div>
</div>

<!-- ================= CONTACTS SCREEN ================= -->
<div class="screen" id="contactsScreen">
  <header>
    <div class="app-title">WhatsApp</div>
    <div class="header-actions">
      <button class="icon-btn" onclick="openSettings()">⚙️ সেটিংস</button>
      <button class="icon-btn" onclick="logout()">লগ আউট</button>

</div>

<!-- ================= SETTINGS SCREEN ================= -->
<div class="screen" id="settingsScreen">
  <header>
    <button class="back-btn" onclick="goToContactsFromSettings()">←</button>
    <div class="app-title">সেটিংস</div>
    <div style="width:24px;"></div>
  </header>
  <div class="settings-content">
    <div class="settings-card">
      <h3>প্রোফাইল কাস্টমাইজেশন</h3>
      <div class="settings-profile-center">
        <div class="settings-avatar-preview" id="settingsAvatarPreview">👤</div>
        <button type="button" class="photo-picker-btn" onclick="document.getElementById('settingsPhotoInput').click()">ছবি পরিবর্তন করুন</button>
        <input type="file" id="settingsPhotoInput" accept="image/*" onchange="onSettingsPhotoSelected(event)" />
      </div>
      <div class="settings-label">আপনার নাম</div>
      <input type="text" class="settings-input" id="settingsNameInput" placeholder="নাম লিখুন" />
      <button class="btn-primary" onclick="saveProfileChanges()">আপডেট করুন</button>
    </div>

    <div class="settings-card">
      <h3>থিম ও ব্যাকগ্রাউন্ড</h3>
      <div class="settings-label">অ্যাপ থিম সিলেক্ট করুন</div>
      <select class="settings-select" id="themeSelector" onchange="changeTheme(this.value)">
        <option value="light">☀️ লাইট মোড (Light)</option>
        <option value="dark">🌙 ডার্ক মোড (Dark)</option>
      </select>
    </div>
  </div>
</div>

<!-- ================= CHAT SCREEN ================= -->
<div class="screen" id="chatScreen">
  <header>
    <button class="back-btn" onclick="goToContacts()">←</button>
    <div class="chat-header-info">
      <div class="avatar" id="chatAvatar" style="width:38px;height:38px;font-size:14px;"></div>
      <div>
        <div class="chat-partner-name" id="chatPartnerName"></div>
        <div class="chat-partner-status" id="chatPartnerStatus"></div>

    </div>
    <!-- Three Dot Options Menu inside Chat -->
    <div class="menu-wrapper">
      <button class="three-dot-btn" onclick="toggleChatMenu(event)">⋮</button>
      <div class="dropdown-menu" id="chatDropdownMenu">
        <div class="dropdown-item" onclick="openSettingsFromChat()">⚙️ অ্যাপ সেটিংস</div>
        <div class="dropdown-item" onclick="toggleDarkModeQuick()">🌙 ডার্ক/লাইট মোড</div>
        <div class="dropdown-item" onclick="goToContacts()">🚪 চ্যাট বন্ধ করুন</div>

    </div>
  </header>
  <div class="messages" id="messagesEl"></div>
  <div class="typing-indicator" id="typingIndicator" style="display:none;">টাইপ করছে...</div>

    <img id="imgPreviewThumb" />
    <span style="flex:1;font-size:12px;">ছবি পাঠানোর জন্য প্রস্তুত</span>
    <button onclick="clearImagePreview()" style="background:none;border:none;color:red;font-size:12px;">বাতিল</button>
  </div>
  <div class="composer">
    <input type="file" id="imageInput" accept="image/*" onchange="onImageSelected(event)" />
    <button class="round-btn img" onclick="document.getElementById('imageInput').click()">📷</button>
    <input type="text" id="messageInput" placeholder="মেসেজ লিখুন..." oninput="onTyping()" onkeydown="if(event.key==='Enter') sendMessage()" />
    <button class="round-btn send" id="sendBtn" onclick="sendMessage()">➤</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBhxb5x8_dGTFaoq4u1Vp2ud_7Ttgcv7Zs",
  authDomain: "n-chat-ee339.firebaseapp.com",
  projectId: "n-chat-ee339",
  storageBucket: "n-chat-ee339.firebasestorage.app",
  messagingSenderId: "870225483677",
  appId: "1:870225483677:web:4b243236fb8c2330724174"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let isSignupMode = false;
let currentUser = null;
let activeConversationId = null;
let activePartner = null;
let messagesUnsub = null;
let convDocUnsub = null;
let usersUnsub = null;
let conversationsUnsub = null;
let pendingImageDataUrl = null;
let pendingSignupPhoto = null;
let pendingSettingsPhoto = null;
let typingTimeout = null;
let heartbeatInterval = null;
let allUsers = [];
let myConversations = {};

/* Three Dot Dropdown Logic */
function toggleChatMenu(event) {
  event.stopPropagation();
  const menu = document.getElementById('chatDropdownMenu');
  menu.classList.toggle('show');
}

function closeDropdowns(event) {
  const menu = document.getElementById('chatDropdownMenu');
  if (menu && menu.classList.contains('show')) {
    menu.classList.remove('show');
  }
}

function openSettingsFromChat() {
  closeDropdowns();
  openSettings();
}

function toggleDarkModeQuick() {
  closeDropdowns();
  const currentTheme = localStorage.getItem('n_chat_theme_mode') || 'light';
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.getElementById('themeSelector').value = newTheme;
  changeTheme(newTheme);
}

function changeTheme(themeName) {
  if (themeName === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
  } else {
    document.documentElement.removeAttribute('data-theme');
  }
  localStorage.setItem('n_chat_theme_mode', themeName);
}

window.addEventListener('DOMContentLoaded', () => {
  const savedTheme = localStorage.getItem('n_chat_theme_mode') || 'light';
  document.getElementById('themeSelector').value = savedTheme;
  changeTheme(savedTheme);
});

const AVATAR_COLORS = ['#075E54', '#128C7E', '#25D366', '#34B7F1', '#E5423A', '#8E5572'];
function colorForName(name) {
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  return AVATAR_COLORS[Math.abs(hash) % AVATAR_COLORS.length];
}
function initialsFor(name) { return (name || '?').trim().charAt(0).toUpperCase(); }
function avatarHtml(user) {
  if (user && user.photoBase64) return `<img src="${user.photoBase64}" alt="" />`;
  return initialsFor(user ? user.displayName : '?');
}
function avatarBg(user) { return (user && user.photoBase64) ? 'transparent' : colorForName(user ? user.displayName || '?' : '?'); }

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function timeAgoLabel(ts) {
  if (!ts) return '';
  const diffMs = Date.now() - ts.toDate().getTime();
  const mins = Math.floor(diffMs / 60000);
  if (mins < 1) return 'এইমাত্র';
  if (mins < 60) return mins + ' মি: আগে';
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + ' ঘণ্টা আগে';
  return Math.floor(hrs / 24) + ' দিন আগে';
}

function shortTime(ts) {
  if (!ts) return '';
  return new Date(ts.toDate()).toLocaleTimeString('bn-BD', { hour: '2-digit', minute: '2-digit' });
}

/* ---------------- Mobile Auth (Without OTP) ---------------- */
function toggleAuthMode() {
  isSignupMode = !isSignupMode;
  document.getElementById('displayNameField').style.display = isSignupMode ? 'block' : 'none';
  document.getElementById('photoPickerRow').style.display = isSignupMode ? 'flex' : 'none';
  document.getElementById('authSubmitBtn').textContent = isSignupMode ? 'রেজিস্টার করুন' : 'লগইন করুন';
  document.getElementById('authSwitchLabel').innerHTML = isSignupMode
    ? 'আগে থেকেই একাউন্ট আছে? <a onclick="toggleAuthMode()">লগইন করুন</a>'
    : 'অ্যাকাউন্ট নেই? <a onclick="toggleAuthMode()">নতুন একাউন্ট খুলুন</a>';
  document.getElementById('authError').textContent = '';
}

function phoneToEmail(phone) {
  const cleanPhone = phone.replace(/[^0-9]/g, '');
  return `user_${cleanPhone}@nchat.local`;
}

function onSignupPhotoSelected(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const SIZE = 120;
      const canvas = document.createElement('canvas');
      canvas.width = SIZE; canvas.height = SIZE;
      const ctx = canvas.getContext('2d');
      const scale = Math.max(SIZE / img.width, SIZE / img.height);
      const w = img.width * scale, h = img.height * scale;
      ctx.drawImage(img, (SIZE - w) / 2, (SIZE - h) / 2, w, h);
      pendingSignupPhoto = canvas.toDataURL('image/jpeg', 0.7);
      document.getElementById('signupPhotoPreview').innerHTML = `<img src="${pendingSignupPhoto}" style="width:100%;height:100%;object-fit:cover;" />`;
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

async function submitAuth() {
  const phone = document.getElementById('phoneField').value.trim();
  const password = document.getElementById('passwordField').value;
  const errEl = document.getElementById('authError');
  errEl.textContent = '';

  if (!phone || phone.length < 11) { errEl.textContent = 'সঠিক মোবাইল নাম্বার দিন'; return; }
  if (!password || password.length < 6) { errEl.textContent = 'পাসওয়ার্ড অন্তত ৬ অক্ষরের হতে হবে'; return; }

  const fakeEmail = phoneToEmail(phone);

  try {
    if (isSignupMode) {
      const displayName = document.getElementById('displayNameField').value.trim();
      if (!displayName) { errEl.textContent = 'আপনার নাম দিন'; return; }
      
      const cred = await auth.createUserWithEmailAndPassword(fakeEmail, password);
      await db.collection('users').doc(cred.user.uid).set({
        displayName,
        phone,
        uid: cred.user.uid,
        photoBase64: pendingSignupPhoto || null,
        online: true,
        lastSeen: firebase.firestore.FieldValue.serverTimestamp(),
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    } else {
      await auth.signInWithEmailAndPassword(fakeEmail, password);
    }
  } catch (e) {
    if(e.code === 'auth/email-already-in-use') errEl.textContent = 'এই নাম্বারে আগেই একাউন্ট খোলা আছে!';
    else if(e.code === 'auth/invalid-credential' || e.code === 'auth/wrong-password') errEl.textContent = 'নাম্বার বা পাসওয়ার্ড ভুল!';
    else errEl.textContent = 'কোনো সমস্যা হয়েছে, আবার চেষ্টা করুন';
  }
}

async function setPresence(online) {
  if (!currentUser) return;
  try {
    await db.collection('users').doc(currentUser.uid).update({
      online, lastSeen: firebase.firestore.FieldValue.serverTimestamp()
    });
  } catch (e) {}
}

function startHeartbeat() {
  setPresence(true);
  heartbeatInterval = setInterval(() => setPresence(true), 20000);
}
function stopHeartbeat() {
  if (heartbeatInterval) clearInterval(heartbeatInterval);
}

function logout() {
  if (messagesUnsub) messagesUnsub();
  if (convDocUnsub) convDocUnsub();
  if (usersUnsub) usersUnsub();
  if (conversationsUnsub) conversationsUnsub();
  setPresence(false);
  stopHeartbeat();
  auth.signOut();
}

auth.onAuthStateChanged(async (user) => {
  if (user) {
    const doc = await db.collection('users').doc(user.uid).get();
    currentUser = { uid: user.uid, ...doc.data() };
    showScreen('contactsScreen');
    startHeartbeat();
    listenContacts();
  } else {
    currentUser = null;
    showScreen('authScreen');
  }
});

/* ---------------- Contacts ---------------- */
function listenContacts() {
  if (usersUnsub) usersUnsub();
  if (conversationsUnsub) conversationsUnsub();

  usersUnsub = db.collection('users').onSnapshot(snap => {
    allUsers = snap.docs.map(d => d.data()).filter(u => u.uid !== currentUser.uid);
    renderContactList();
  });

  conversationsUnsub = db.collection('conversations')
    .where('participants', 'array-contains', currentUser.uid)
    .onSnapshot(snap => {
      myConversations = {};
      snap.docs.forEach(d => { myConversations[d.id] = d.data(); });
      renderContactList();
    });
}

function renderContactList() {
  const listEl = document.getElementById('contactList');
  if (allUsers.length === 0) {
    listEl.innerHTML = '<div class="empty-state">এখনো অন্য কেউ এই অ্যাপে একাউন্ট খোলেনি। অন্য ফোন থেকে রেজিস্ট্রেশন করতে বলুন।</div>';
    return;
  }
  const rows = allUsers.map(u => {
    const convId = conversationIdFor(currentUser.uid, u.uid);
    const conv = myConversations[convId];
    const preview = conv ? (conv.lastMessageType === 'image' ? '📷 ছবি' : (conv.lastMessageText || '')) : 'চ্যাট করতে ক্লিক করুন';
    const previewPrefixed = conv && conv.lastMessageSenderId === currentUser.uid ? 'আপনি: ' + preview : preview;
    const unread = conv && conv.unreadCount && conv.unreadCount[currentUser.uid] ? conv.unreadCount[currentUser.uid] : 0;
    const sortKey = conv && conv.lastUpdated ? conv.lastUpdated.toMillis() : 0;
    return { u, convId, previewPrefixed, unread, timeLabel: conv ? timeAgoLabel(conv.lastUpdated) : '', sortKey };
  }).sort((a, b) => b.sortKey - a.sortKey);

  listEl.innerHTML = rows.map(r => `
    <div class="contact-row" onclick='openChat(${JSON.stringify(r.u)})'>
      <div class="avatar-wrap">
        <div class="avatar" style="background:${avatarBg(r.u)}">${avatarHtml(r.u)}</div>
        ${r.u.online ? '<div class="online-dot"></div>' : ''}
      </div>
      <div class="contact-main">
        <div class="contact-top-row">
          <div class="contact-name">${r.u.displayName}</div>
          <div class="contact-time">${r.timeLabel}</div>
        </div>
        <div class="contact-phone">📱 ${r.u.phone || 'নাম্বার নেই'}</div>
        <div class="contact-bottom-row">
          <div class="contact-sub">${escapeHtml(r.previewPrefixed)}</div>
          ${r.unread > 0 ? `<div class="unread-badge">${r.unread}</div>` : ''}
        </div>
      </div>
    </div>
  `).join('');
}

function conversationIdFor(uidA, uidB) { return [uidA, uidB].sort().join('_'); }

/* ---------------- Settings & Profile ---------------- */
function openSettings() {
  document.getElementById('settingsNameInput').value = currentUser.displayName || '';
  const previewEl = document.getElementById('settingsAvatarPreview');
  previewEl.style.background = avatarBg(currentUser);
  previewEl.innerHTML = avatarHtml(currentUser);
  pendingSettingsPhoto = currentUser.photoBase64 || null;
  showScreen('settingsScreen');
}

function goToContactsFromSettings() { showScreen('contactsScreen'); }

function onSettingsPhotoSelected(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const SIZE = 120;
      const canvas = document.createElement('canvas');
      canvas.width = SIZE; canvas.height = SIZE;
      const ctx = canvas.getContext('2d');
      const scale = Math.max(SIZE / img.width, SIZE / img.height);
      const w = img.width * scale, h = img.height * scale;
      ctx.drawImage(img, (SIZE - w) / 2, (SIZE - h) / 2, w, h);
      pendingSettingsPhoto = canvas.toDataURL('image/jpeg', 0.7);
      const previewEl = document.getElementById('settingsAvatarPreview');
      previewEl.style.background = 'transparent';
      previewEl.innerHTML = `<img src="${pendingSettingsPhoto}" style="width:100%;height:100%;object-fit:cover;" />`;
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

async function saveProfileChanges() {
  const newName = document.getElementById('settingsNameInput').value.trim();
  if (!newName) { alert('নাম প্রদান করুন'); return; }

  try {
    await db.collection('users').doc(currentUser.uid).update({
      displayName: newName,
      photoBase64: pendingSettingsPhoto
    });
    currentUser.displayName = newName;
    currentUser.photoBase64 = pendingSettingsPhoto;
    alert('প্রোফাইল আপডেট হয়েছে!');
    showScreen('contactsScreen');
  } catch (e) { alert('আপডেট করতে সমস্যা হয়েছে'); }
}

/* ---------------- Chat Management ---------------- */
function goToContacts() {
  if (messagesUnsub) messagesUnsub();
  if (convDocUnsub) convDocUnsub();
  if (typingTimeout) clearTimeout(typingTimeout);
  if (activeConversationId) setTyping(false);
  activeConversationId = null;
  activePartner = null;
  clearImagePreview();
  showScreen('contactsScreen');
}

function openChat(partner) {
  activePartner = partner;
  activeConversationId = conversationIdFor(currentUser.uid, partner.uid);
  document.getElementById('chatPartnerName').textContent = partner.displayName;
  const avatarEl = document.getElementById('chatAvatar');
  avatarEl.style.background = avatarBg(partner);
  avatarEl.innerHTML = avatarHtml(partner);
  document.getElementById('messagesEl').innerHTML = '';
  document.getElementById('chatPartnerStatus').textContent = partner.online ? 'অনলাইন' : (partner.lastSeen ? 'শেষ সক্রিয়: ' + timeAgoLabel(partner.lastSeen) : '');
  showScreen('chatScreen');

  db.collection('conversations').doc(activeConversationId).set({
    participants: [currentUser.uid, partner.uid],
    unreadCount: { [currentUser.uid]: 0 }
  }, { merge: true });

  if (messagesUnsub) messagesUnsub();
  messagesUnsub = db.collection('conversations').doc(activeConversationId)
    .collection('messages').orderBy('timestamp', 'asc')
    .onSnapshot(snap => {
      const el = document.getElementById('messagesEl');
      el.innerHTML = snap.docs.map(d => renderMessage(d.data(), d.id)).join('');
      el.scrollTop = el.scrollHeight;
      markIncomingAsSeen(snap.docs);
    });

  if (convDocUnsub) convDocUnsub();
  convDocUnsub = db.collection('conversations').doc(activeConversationId).onSnapshot(doc => {
    const data = doc.data();
    const typingEl = document.getElementById('typingIndicator');
    typingEl.style.display = (data && data.typing && data.typing[partner.uid]) ? 'block' : 'none';
  });
}

async function markIncomingAsSeen(docs) {
  const batch = db.batch();
  let any = false;
  docs.forEach(d => {
    const m = d.data();
    if (m.senderId !== currentUser.uid && !m.seen) {
      batch.update(d.ref, { seen: true });
      any = true;
    }
  });
  if (any) { try { await batch.commit(); } catch (e) {} }
}

function renderMessage(m, docId) {
  const mine = m.senderId === currentUser.uid;
  const time = shortTime(m.timestamp);
  let inner = '';
  if (m.deleted) {
    inner += `<div style="font-style:italic;opacity:0.7;">মেসেজটি মুছে ফেলা হয়েছে</div>`;
  } else {
    if (m.text) inner += `<div>${escapeHtml(m.text)}</div>`;
    if (m.imageUrl) inner += `<img src="${m.imageUrl}" />`;
  }
  const ticks = mine ? `<span class="ticks ${m.seen ? 'seen' : ''}">${m.seen ? '✓✓' : '✓'}</span>` : '';
  const deleteBtn = (mine && !m.deleted) ? `<button class="delete-msg-btn" onclick="deleteMessage('${docId}')">🗑</button>` : '';
  return `<div class="msg-row ${mine ? 'mine' : ''}">
            ${deleteBtn}
            <div class="bubble ${mine ? 'mine' : 'theirs'}">${inner}<div class="meta-row"><span class="time">${time}</span>${ticks}</div></div>
          </div>`;
}

async function deleteMessage(docId) {
  if (!confirm('মেসেজটি ডিলিট করতে চান?')) return;
  await db.collection('conversations').doc(activeConversationId).collection('messages').doc(docId).update({ deleted: true });
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

function onTyping() {
  if (!activeConversationId) return;
  setTyping(true);
  if (typingTimeout) clearTimeout(typingTimeout);
  typingTimeout = setTimeout(() => setTyping(false), 3000);
}

async function setTyping(isTyping) {
  if (!activeConversationId || !activePartner) return;
  try {
    await db.collection('conversations').doc(activeConversationId).set({
      participants: [currentUser.uid, activePartner.uid],
      typing: { [currentUser.uid]: isTyping }
    }, { merge: true });
  } catch (e) {}
}

function onImageSelected(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const MAX_W = 800;
      const scale = Math.min(1, MAX_W / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      pendingImageDataUrl = canvas.toDataURL('image/jpeg', 0.6);
      document.getElementById('imgPreviewThumb').src = pendingImageDataUrl;
      document.getElementById('imgPreviewBar').style.display = 'flex';
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function clearImagePreview() {
  pendingImageDataUrl = null;
  document.getElementById('imageInput').value = '';
  document.getElementById('imgPreviewBar').style.display = 'none';
}

async function sendMessage() {
  const input = document.getElementById('messageInput');
  const text = input.value.trim();
  if (!text && !pendingImageDataUrl) return;

  const sendBtn = document.getElementById('sendBtn');
  sendBtn.disabled = true;

  try {
    const isImage = !!pendingImageDataUrl;
    await db.collection('conversations').doc(activeConversationId).set({
      participants: [currentUser.uid, activePartner.uid],
      lastUpdated: firebase.firestore.FieldValue.serverTimestamp(),
      lastMessageText: text || null,
      lastMessageType: isImage ? 'image' : 'text',
      lastMessageSenderId: currentUser.uid,
      typing: { [currentUser.uid]: false },
      unreadCount: { [activePartner.uid]: firebase.firestore.FieldValue.increment(1) }
    }, { merge: true });

    await db.collection('conversations').doc(activeConversationId).collection('messages').add({
      senderId: currentUser.uid,
      text: text || null,
      imageUrl: pendingImageDataUrl || null,
      timestamp: firebase.firestore.FieldValue.serverTimestamp(),
      seen: false
    });

    input.value = '';
    clearImagePreview();
    if (typingTimeout) clearTimeout(typingTimeout);
  } catch (e) {
    alert('মেসেজ পাঠাতে সমস্যা হয়েছে');
  } finally {
    sendBtn.disabled = false;
  }
}
</script>
