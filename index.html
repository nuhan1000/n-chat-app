<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuvox</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4F46E5',
                        accent: '#818CF8',
                        chatbg: '#F9FAFB',
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 h-screen flex flex-col overflow-hidden">

    <!-- App Container -->
    <div id="app-container" class="flex h-full w-full max-w-7xl mx-auto bg-white shadow-xl relative">

        <!-- Sidebar: Chat List -->
        <aside id="sidebar" class="w-full md:w-1/3 lg:w-1/4 border-r border-gray-200 flex flex-col h-full bg-white z-10">
            <!-- Sidebar Header -->
            <div class="p-4 bg-gray-50 border-b border-gray-200 flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-full bg-primary text-white flex items-center justify-center font-bold text-lg">
                        N
                    </div>
                    <span class="font-bold text-xl text-gray-800">Nuvox</span>
                </div>
                <div class="flex space-x-3 text-gray-600">
                    <button onclick="openSettings()" class="hover:text-primary transition" title="Settings">
                        <i class="fa-solid fa-gear text-lg"></i>
                    </button>
                </div>
            </div>

            <!-- Search Bar -->
            <div class="p-3 border-b border-gray-100">
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </span>
                    <input type="text" placeholder="Search or start new chat" class="w-full pl-10 pr-4 py-2 bg-gray-100 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary">
                </div>
            </div>

            <!-- Chat List Items -->
            <div id="chat-list" class="flex-1 overflow-y-auto divide-y divide-gray-100">
                <!-- Dynamically populated or static sample chat -->
                <div onclick="selectChat('Alex Johnson', 'online')" class="flex items-center p-3 hover:bg-gray-50 cursor-pointer transition">
                    <div class="relative">
                        <div class="w-12 h-12 rounded-full bg-accent text-white flex items-center justify-center font-semibold text-lg">
                            AJ
                        </div>
                        <span class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-white rounded-full"></span>
                    </div>
                    <div class="ml-3 flex-1 overflow-hidden">
                        <div class="flex justify-between items-baseline">
                            <h3 class="font-semibold text-gray-900 truncate">Alex Johnson</h3>
                            <span class="text-xs text-gray-400">12:45 PM</span>
                        </div>
                        <p class="text-sm text-gray-500 truncate">Hey! Are we still meeting today?</p>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main id="chat-area" class="flex-1 flex flex-col h-full bg-chatbg hidden md:flex">
            <!-- Chat Header -->
            <div class="p-4 bg-white border-b border-gray-200 flex justify-between items-center shadow-sm">
                <div class="flex items-center space-x-3">
                    <button onclick="backToSidebar()" class="md:hidden text-gray-600 hover:text-primary mr-1">
                        <i class="fa-solid fa-arrow-left text-lg"></i>
                    </button>
                    <div class="w-10 h-10 rounded-full bg-accent text-white flex items-center justify-center font-semibold">
                        AJ
                    </div>
                    <div>
                        <h2 id="active-chat-name" class="font-semibold text-gray-800">Alex Johnson</h2>
                        <span id="active-chat-status" class="text-xs text-green-500">online</span>
                    </div>
                </div>
                <div class="relative">
                    <button onclick="toggleOptionsMenu()" class="text-gray-600 hover:text-primary p-2 rounded-full">
                        <i class="fa-solid fa-ellipsis-vertical text-lg"></i>
                    </button>
                    <!-- Dropdown Menu -->
                    <div id="options-menu" class="hidden absolute right-0 mt-2 w-48 bg-white border border-gray-200 rounded-lg shadow-lg py-1 z-20">
                        <button onclick="clearChat()" class="w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Clear Messages</button>
                        <button onclick="blockContact()" class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-gray-100">Block Contact</button>
                    </div>
                </div>
            </div>

            <!-- Message History Container -->
            <div id="message-container" class="flex-1 overflow-y-auto p-4 space-y-4">
                <div class="flex justify-start">
                    <div class="bg-white px-4 py-2 rounded-lg shadow-sm max-w-xs md:max-w-md text-gray-800 text-sm border border-gray-100">
                        Hey! Are we still meeting today?
                        <span class="block text-[10px] text-gray-400 text-right mt-1">12:45 PM</span>
                    </div>
                </div>
            </div>

            <!-- Input & Attachment Bar -->
            <div class="p-3 bg-white border-t border-gray-200 flex items-center space-x-2 relative">
                <!-- Attachment Menu Popup -->
                <div id="attachment-menu" class="hidden absolute bottom-16 left-4 bg-white border border-gray-200 rounded-lg shadow-lg p-2 flex flex-space space-y-2 flex-col z-20">
                    <button onclick="attachFile('document')" class="flex items-center space-x-2 px-3 py-2 text-sm text-gray-700 hover:bg-gray-100 rounded"><i class="fa-solid fa-file text-primary"></i> <span>Document</span></button>
                    <button onclick="attachFile('media')" class="flex items-center space-x-2 px-3 py-2 text-sm text-gray-700 hover:bg-gray-100 rounded"><i class="fa-solid fa-image text-accent"></i> <span>Photos & Videos</span></button>
                    <button onclick="attachFile('location')" class="flex items-center space-x-2 px-3 py-2 text-sm text-gray-700 hover:bg-gray-100 rounded"><i class="fa-solid fa-location-dot text-green-500"></i> <span>Location</span></button>
                </div>

                <button onclick="toggleAttachmentMenu()" class="text-gray-500 hover:text-primary p-2 rounded-full transition">
                    <i class="fa-solid fa-paperclip text-xl"></i>
                </button>
                <input id="message-input" type="text" placeholder="Type a message..." class="flex-1 px-4 py-2 bg-gray-100 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary" onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()" class="bg-primary text-white p-2.5 rounded-lg hover:bg-indigo-700 transition">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </main>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        function selectChat(name, status) {
            document.getElementById('active-chat-name').innerText = name;
            document.getElementById('active-chat-status').innerText = status;
            
            // Handle responsive view shifts on mobile
            if (window.innerWidth < 768) {
                document.getElementById('sidebar').classList.add('hidden');
                document.getElementById('chat-area').classList.remove('hidden');
            }
        }

        function backToSidebar() {
            document.getElementById('sidebar').classList.remove('hidden');
            document.getElementById('chat-area').classList.add('hidden');
        }

        function toggleOptionsMenu() {
            const menu = document.getElementById('options-menu');
            menu.classList.toggle('hidden');
        }

        function toggleAttachmentMenu() {
            const menu = document.getElementById('attachment-menu');
            menu.classList.toggle('hidden');
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if(!text) return;

            const container = document.getElementById('message-container');
            const messageDiv = document.createElement('div');
            messageDiv.className = "flex justify-end";
            messageDiv.innerHTML = `
                <div class="bg-primary text-white px-4 py-2 rounded-lg shadow-sm max-w-xs md:max-w-md text-sm">
                    ${text}
                    <span class="block text-[10px] text-indigo-200 text-right mt-1">Just now</span>
                </div>
            `;
            container.appendChild(messageDiv);
            input.value = '';
            container.scrollTop = container.scrollHeight;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }

        function clearChat() {
            document.getElementById('message-container').innerHTML = '';
            toggleOptionsMenu();
        }

        function blockContact() {
            alert('Contact blocked successfully.');
            toggleOptionsMenu();
        }

        function openSettings() {
            alert('Opening Nuvox Settings panel.');
        }

        function attachFile(type) {
            alert(`Attached ${type} successfully.`);
            toggleAttachmentMenu();
        }
    </script>
</body>
</html>
