<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sage Chat</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js for interactivity -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sagePrimary: '#4A6B5B',
                        sageBackground: '#F7F5F0',
                        sageIncoming: '#EAE5D9',
                        sageOutgoing: '#6C8F7E',
                        sageAccent: '#C27856',
                        sageHover: '#DFD9CE'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-sageBackground text-zinc-800 h-screen flex flex-col overflow-hidden" x-data="chatApp()">

    <!-- App Container -->
    <div class="flex h-full w-full max-w-7xl mx-auto shadow-xl my-auto rounded-none md:rounded-2xl overflow-hidden border border-zinc-200">
        
        <!-- Sidebar: Chat List -->
        <div :class="{'hidden md:flex': activeChat, 'flex': !activeChat}" class="w-full md:w-80 bg-white border-r border-zinc-200 flex-col">
            <!-- Sidebar Header -->
            <div class="p-4 bg-sagePrimary text-white flex justify-between items-center">
                <h1 class="font-bold text-lg tracking-wide">Chats</h1>
                <div class="flex space-x-3 text-sm opacity-90">
                    <span>Settings</span>
                </div>
            </div>

            <!-- Search Bar -->
            <div class="p-3 bg-white border-b border-zinc-100">
                <input type="text" placeholder="Search or start new chat" class="w-full px-3 py-2 bg-sageBackground rounded-lg text-sm focus:outline-none focus:ring-1 focus:ring-sagePrimary">
            </div>

            <!-- Chat Contacts List -->
            <div class="flex-1 overflow-y-auto divide-y divide-zinc-100">
                <template x-for="chat in chats" :key="chat.id">
                    <div @click="selectChat(chat)" 
                         :class="{'bg-sageBackground': activeChat && activeChat.id === chat.id}"
                         class="flex items-center px-4 py-3 cursor-pointer hover:bg-sageBackground transition-colors">
                        <div class="w-12 h-12 rounded-full bg-sagePrimary text-white flex items-center justify-center font-bold text-lg mr-3 shadow-sm" x-text="chat.avatar"></div>
                        <div class="flex-1 min-w-0">
                            <div class="flex justify-between items-baseline">
                                <h3 class="font-semibold text-zinc-900 truncate" x-text="chat.name"></h3>
                                <span class="text-xs text-zinc-400" x-text="chat.time"></span>
                            </div>
                            <p class="text-sm text-zinc-500 truncate" x-text="chat.lastMessage"></p>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <!-- Main Chat Area -->
        <div :class="{'flex': activeChat, 'hidden md:flex': !activeChat}" class="flex-1 flex-col bg-[#FDFBF7]">
            
            <template x-if="activeChat">
                <div class="flex flex-col h-full">
                    <!-- Chat Header -->
                    <div class="p-4 bg-sagePrimary text-white flex items-center justify-between shadow-sm">
                        <div class="flex items-center">
                            <button @click="activeChat = null" class="md:hidden mr-3 text-white focus:outline-none">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                                </svg>
                            </button>
                            <div class="w-10 h-10 rounded-full bg-white text-sagePrimary flex items-center justify-center font-bold mr-3" x-text="activeChat.avatar"></div>
                            <div>
                                <h2 class="font-semibold text-base leading-tight" x-text="activeChat.name"></h2>
                                <span class="text-xs opacity-80">Online</span>
                            </div>
                        </div>
                        <div class="flex items-center space-x-4">
                            <button class="text-white hover:opacity-80">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Messages Log -->
                    <div class="flex-1 p-4 overflow-y-auto space-y-3 flex flex-col">
                        <template x-for="msg in activeChat.messages" :key="msg.id">
                            <div :class="msg.sender === 'me' ? 'self-end' : 'self-start'" class="max-w-[75%] md:max-w-[60%]">
                                <div :class="msg.sender === 'me' ? 'bg-sageOutgoing text-white rounded-l-xl rounded-tr-xl' : 'bg-sageIncoming text-zinc-800 rounded-r-xl rounded-tl-xl'" 
                                     class="p-3 shadow-sm text-sm relative">
                                    <p x-text="msg.text" class="leading-relaxed"></p>
                                    <div class="flex justify-end items-center mt-1 space-x-1">
                                        <span class="text-[10px] opacity-70" x-text="msg.time"></span>
                                        <template x-if="msg.sender === 'me'">
                                            <span class="text-[10px] opacity-80">✓✓</span>
                                        </template>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>

                    <!-- Message Input Box -->
                    <div class="p-3 bg-white border-t border-zinc-200 flex items-center space-x-2">
                        <input type="text" 
                               x-model="newMessageText" 
                               @keydown.enter="sendMessage()" 
                               placeholder="Type a soft-toned message..." 
                               class="flex-1 px-4 py-2.5 bg-sageBackground rounded-full text-sm focus:outline-none focus:ring-1 focus:ring-sagePrimary">
                        <button @click="sendMessage()" class="bg-sageAccent hover:opacity-90 text-white p-2.5 rounded-full shadow-sm transition-transform active:scale-95 flex items-center justify-center">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 rotate-90" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                            </svg>
                        </button>
                    </div>
                </div>
            </template>

            <!-- Empty State when no chat is selected -->
            <template x-if="!activeChat">
                <div class="flex-1 flex flex-col items-center justify-center text-zinc-400 p-6 text-center">
                    <div class="w-20 h-20 bg-sageIncoming rounded-full flex items-center justify-center mb-4 text-sagePrimary font-bold text-2xl shadow-inner">🌿</div>
                    <h3 class="text-lg font-medium text-zinc-700">Select a conversation</h3>
                    <p class="text-sm max-w-sm mt-1">Choose from your chats on the left to start messaging with an eye-soothing, stress-free interface.</p>
                </div>
            </template>

        </div>
    </div>

    <script>
        function chatApp() {
            return {
                activeChat: null,
                newMessageText: '',
                chats: [
                    {
                        id: 1,
                        name: 'Ayesha Rahman',
                        avatar: 'AR',
                        time: '10:45 AM',
                        lastMessage: 'The new design color is super relaxing!',
                        messages: [
                            { id: 1, sender: 'them', text: 'Hey! Have you checked out the new app theme color?', time: '10:40 AM' },
                            { id: 2, sender: 'me', text: 'Yes! Using the sage and earthy moss tones.', time: '10:42 AM' },
                            { id: 3, sender: 'them', text: 'The new design color is super relaxing!', time: '10:45 AM' }
                        ]
                    },
                    {
                        id: 2,
                        name: 'Tanvir Ahmed',
                        avatar: 'TA',
                        time: 'Yesterday',
                        lastMessage: 'Send me the project update details.',
                        messages: [
                            { id: 1, sender: 'them', text: 'Send me the project update details.', time: 'Yesterday' }
                        ]
                    }
                ],
                selectChat(chat) {
                    this.activeChat = chat;
                },
                sendMessage() {
                    if (!this.newMessageText.trim() || !this.activeChat) return;
                    
                    const timeString = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    
                    // Push message to current active chat
                    this.activeChat.messages.push({
                        id: Date.now(),
                        sender: 'me',
                        text: this.newMessageText,
                        time: timeString
                    });

                    this.activeChat.lastMessage = this.newMessageText;
                    this.activeChat.time = timeString;
                    
                    const textCopy = this.newMessageText;
                    this.newMessageText = '';

                    // Scroll to bottom simulation / auto reply trigger
                    setTimeout(() => {
                        if (this.activeChat) {
                            this.activeChat.messages.push({
                                id: Date.now() + 1,
                                sender: 'them',
                                text: `Got your message: "${textCopy}". Looks amazing!`,
                                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                            });
                        }
                    }, 1000);
                }
            }
        }
    </script>
</body>
</html>
