<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N Chat Collapse Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .chat-container {
            width: 350px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        /* কোলাপ্স ট্রিগার হেডার */
        .collapse-header {
            padding: 15px;
            background: #0084ff;
            color: white;
            cursor: pointer;
            font-weight: bold;
            user-select: none;
            /* কোনো আন্ডারলাইন নেই */
            text-decoration: none; 
        }

        .collapse-header:hover {
            background: #006dd9;
        }

        /* কোলাপ্স কন্টেন্ট সেকশন - কোনো ফেড এফেক্ট নেই, সরাসরি খুলবে/বন্ধ হবে */
        .collapse-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            background: #f9f9f9;
        }

        .collapse-content .inner-content {
            padding: 15px;
            color: #333;
            font-size: 14px;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <!-- Click here for contact info (আন্ডারলাইন ও ফেড ছাড়া কোলাপ্স বাটন) -->
    <div class="collapse-header" onclick="toggleCollapse()">
        Click here for contact info
    </div>
    
    <!-- কোলাপ্স হওয়া অংশ -->
    <div class="collapse-content" id="contactInfo">
        <div class="inner-content">
            <p><strong>Name:</strong> Nuhan Nuhu</p>
            <p><strong>Phone:</strong> +880XXXXXXXXXX</p>
            <p><strong>Email:</strong> example@email.com</p>
        </div>
    </div>
</div>

<script>
    function toggleCollapse() {
        const content = document.getElementById("contactInfo");
        if (content.style.maxHeight) {
            content.style.maxHeight = null;
        } else {
            content.style.maxHeight = content.scrollHeight + "px";
        }
    }
</script>

</body>
</html>
