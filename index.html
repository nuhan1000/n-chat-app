<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>N Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --teal: #1F4E4A;
    --teal-deep: #163a37;
    --marigold: #E0A458;
    --rose: #E8B4B8;
    --bg: #F3F5F1;
    --panel: #FFFFFF;
    --border: #E2E7E2;
    --text: #1E2A28;
    --muted: #6B7A76;
    --online: #3FAE5C;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Hind Siliguri', sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  input, button, textarea { font-family: 'Hind Siliguri', sans-serif; }
  input:focus, textarea:focus { outline: 2px solid var(--teal); outline-offset: 1px; }
  button { cursor: pointer; -webkit-tap-highlight-color: transparent; }

  .screen { display: none; height: 100vh; height: 100dvh; flex-direction: column; }
  .screen.active { display: flex; }

  /* ---------- Auth screen ---------- */
  #authScreen { align-items: center; justify-content: center; background: linear-gradient(160deg, var(--teal) 0%, var(--teal-deep) 100%); padding: 24px; overflow-y: auto; }
  .auth-card { width: 100%; max-width: 360px; background: var(--panel); border-radius: 20px; padding: 32px 26px; box-shadow: 0 24px 50px -20px rgba(0,0,0,0.5); margin: 20px 0; }
  .auth-logo { font-family: 'Baloo Da 2', sans-serif; font-size: 30px; font-weight: 800; color: var(--teal); text-align: center; margin-bottom: 4px; }
  .auth-sub { text-align: center; font-size: 12.5px; color: var(--muted); margin-bottom: 22px; }
  .field { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--border); font-size: 14px; margin-bottom: 10px; background: #FAFBFA; }
  .btn-primary { width: 100%; padding: 12px 0; border-radius: 12px; border: none; background: var(--teal); color: #fff; font-weight: 700; font-size: 14px; margin-top: 4px; }
  .btn-primary:hover { background: var(--teal-deep); }
  .auth-switch { text-align: center; font-size: 12.5px; color: var(--muted); margin-top: 16px; }
  .auth-switch a { color: var(--teal); font-weight: 700; text-decoration: none; cursor: pointer; }
  .auth-error { color: #B3423A; font-size: 12px; text-align: center; min-height: 16px; margin-bottom: 6px; }
  .photo-picker-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .photo-picker-preview { width: 52px; height: 52px; border-radius: 50%; background: #EFEFEF; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; border: 1.5px solid var(--border); }
  .photo-picker-preview img { width: 100%; height: 100%; object-fit: cover; }
  .photo-picker-btn { font-size: 12px; color: var(--teal); font-weight: 700; background: none; border: 1.5px solid var(--teal); padding: 6px 12px; border-radius: 10px; }

  /* ---------- Contacts screen ---------- */
  #contactsScreen header, #chatScreen header {
    background: var(--teal); color: #fff; padding: 16px 18px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
  }
  .app-title { font-family: 'Baloo Da 2', sans-serif; font-weight: 700; font-size: 19px; }
  .icon-btn { background: rgba(255,255,255,0.12); border: none; color: #fff; border-radius: 10px; padding: 8px 12px; font-size: 12px; font-weight: 600; }
  .contact-list { flex: 1; overflow-y: auto; padding: 8px 0; }
  .contact-row { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--border); background: var(--panel); cursor: pointer; }
  .contact-row:hover { background: #F7FAF8; }
  .avatar-wrap { position: relative; flex-shrink: 0; }
  .avatar { width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; color: #fff; overflow: hidden; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .online-dot { position: absolute; bottom: 0; right: 0; width: 12px; height: 12px; border-radius: 50%; background: var(--online); border: 2px solid var(--panel); }
  .contact-main { flex: 1; min-width: 0; }
  .contact-top-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .contact-name { font-weight: 600; font-size: 14.5px; }
  .contact-time { font-size: 10.5px; color: var(--muted); white-space: nowrap; }
  .contact-bottom-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 2px; }
  .contact-sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .unread-badge { background: var(--marigold); color: #3a2405; font-size: 11px; font-weight: 800; min-width: 20px; height: 20px; border-radius: 10px; display: flex; align-items: center; justify-content: center; padding: 0 5px; flex-shrink: 0; }
  .empty-state { text-align: center; color: var(--muted); font-size: 13px; padding: 60px 24px; }

  /* ---------- Chat screen ---------- */
  #chatScreen header { gap: 10px; }
  .back-btn { background: none; border: none; color: #fff; font-size: 20px; padding: 0 4px; }
  .chat-header-info { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
  .chat-header-text { min-width: 0; }
  .chat-partner-name { font-family: 'Baloo Da 2', sans-serif; font-weight: 700; font-size: 16px; }
  .chat-partner-status { font-size: 11px; color: rgba(255,255,255,0.75); }
  .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 4px; background: var(--bg); }
  .msg-row { display: flex; align-items: center; gap: 6px; }
  .msg-row.mine { justify-content: flex-end; }
  .delete-msg-btn { background: none; border: none; font-size: 12px; opacity: 0.45; padding: 2px 4px; order: -1; }
  .delete-msg-btn:hover { opacity: 1; }
  .bubble { max-width: 72%; padding: 9px 13px; border-radius: 16px; font-size: 14px; line-height: 1.45; position: relative; }
  .bubble.theirs { background: #fff; border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .bubble.mine { background: var(--teal); color: #fff; border-bottom-right-radius: 4px; }
  .bubble img { max-width: 100%; border-radius: 10px; display: block; margin-top: 4px; }
  .bubble .meta-row { display: flex; align-items: center; justify-content: flex-end; gap: 3px; margin-top: 4px; }
  .bubble .time { font-size: 10px; opacity: 0.7; }
  .bubble .ticks { font-size: 11px; }
  .bubble .ticks.seen { color: #7FD8FF; }
  .typing-indicator { font-size: 12px; color: var(--muted); padding: 4px 16px; font-style: italic; }
  .composer { display: flex; align-items: center; gap: 8px; padding: 10px 12px; padding-bottom: max(10px, env(safe-area-inset-bottom)); background: var(--panel); border-top: 1px solid var(--border); flex-shrink: 0; }
  .composer input[type="text"] { flex: 1; border: 1.5px solid var(--border); border-radius: 22px; padding: 10px 16px; font-size: 14px; background: #FAFBFA; }
  .round-btn { width: 40px; height: 40px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 16px; }
  .round-btn.img { background: var(--rose); color: var(--teal-deep); }
  .round-btn.send { background: var(--teal); color: #fff; }
  .round-btn.send:disabled { opacity: 0.5; }
  #imageInput, #photoInput { display: none; }
  .img-preview-bar { padding: 8px 14px; background: #FAFBFA; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
  .img-preview-bar img { width: 44px; height: 44px; object-fit: cover; border-radius: 8px; }
  .img-preview-bar span { font-size: 12px; color: var(--muted); flex: 1; }
  .img-preview-bar button { background: none; border: none; color: #B3423A; font-size: 12px; font-weight: 700; }
</style>
</head>
<body>

<!-- ================= AUTH SCREEN ================= -->
<div class="screen active" id="authScreen">
  <div class="auth-card">
    <div class="auth-logo">N Chat</div>
    <div class="auth-sub" id="authSubLabel">পরিবার ও কাছের মানুষের জন্য</div>
    <div class="auth-error" id="authError"></div>
    <input class="field" id="displayNameField" placeholder="আপনার নাম" style="display:none;" />
    <div class="photo-picker-row" id="photoPickerRow" style="display:none;">
      <div class="photo-picker-preview" id="signupPhotoPreview">📷</div>
      <button type="button" class="photo-picker-btn" onclick="document.getElementById('photoInput').click()">প্রোফাইল ছবি (ঐচ্ছিক)</button>
      <input type="file" id="photoInput" accept="image/*" onchange="onSignupPhotoSelected(event)" />
    </div>
    <input class="field" id="emailField" type="email" placeholder="ইমেইল" />
    <input class="field" id="passwordField" type="password" placeholder="পাসওয়ার্ড" />
    <button class="btn-primary" id="authSubmitBtn" onclick="submitAuth()">লগইন করুন</button>
    <div class="auth-switch" id="authSwitchLabel">অ্যাকাউন্ট নেই? <a onclick="toggleAuthMode()">সাইন আপ করুন</a></div>
  </div>
</div>

<!-- ================= CONTACTS SCREEN ================= -->
<div class="screen" id="contactsScreen">
  <header>
    <div class="app-title">N Chat</div>
    <button class="icon-btn" onclick="logout()">লগ আউট</button>
  </header>
  <div class="contact-list" id="contactList"></div>
</div>

<!-- ================= CHAT SCREEN ================= -->
<div class="screen" id="chatScreen">
  <header>
    <button class="back-btn" onclick="goToContacts()">←</button>
    <div class="chat-header-info">
      <div class="avatar" id="chatAvatar" style="width:36px;height:36px;font-size:13px;"></div>
      <div class="chat-header-text">
        <div class="chat-partner-name" id="chatPartnerName"></div>
        <div class="chat-partner-status" id="chatPartnerStatus"></div>
      </div>
    </div>
  </header>
  <div class="messages" id="messagesEl"></div>
  <div class="typing-indicator" id="typingIndicator" style="display:none;">টাইপ করছে...</div>
  <div class="img-preview-bar" id="imgPreviewBar" style="display:none;">
    <img id="imgPreviewThumb" />
    <span>ছবি পাঠানোর জন্য প্রস্তুত</span>
    <button onclick="clearImagePreview()">বাতিল</button>
  </div>
  <div class="composer">
    <input type="file" id="imageInput" accept="image/*" onchange="onImageSelected(event)" />
    <button class="round-btn img" onclick="document.getElementById('imageInput').click()">📷</button>
    <input type="text" id="messageInput" placeholder="মেসেজ লিখুন..." oninput="onTyping()" onkeydown="if(event.key==='Enter') sendMessage()" />
    <button class="round-btn send" id="sendBtn" onclick="sendMessage()">➤</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBhxb5x8_dGTFaoq4u1Vp2ud_7Ttgcv7Zs",
  authDomain: "n-chat-ee339.firebaseapp.com",
  projectId: "n-chat-ee339",
  storageBucket: "n-chat-ee339.firebasestorage.app",
  messagingSenderId: "870225483677",
  appId: "1:870225483677:web:4b243236fb8c2330724174"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let isSignupMode = false;
let currentUser = null;
let activeConversationId = null;
let activePartner = null;
let messagesUnsub = null;
let convDocUnsub = null;
let usersUnsub = null;
let conversationsUnsub = null;
let pendingImageDataUrl = null;
let pendingSignupPhoto = null;
let typingTimeout = null;
let heartbeatInterval = null;
let allUsers = [];
let myConversations = {};

const AVATAR_COLORS = ['#1F4E4A', '#E0A458', '#8E5572', '#3B6E8F', '#B3423A', '#5B7B4B'];
function colorForName(name) {
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  return AVATAR_COLORS[Math.abs(hash) % AVATAR_COLORS.length];
}
function initialsFor(name) { return (name || '?').trim().charAt(0).toUpperCase(); }
function avatarHtml(user, size) {
  const s = size || 46;
  if (user.photoBase64) return `<img src="${user.photoBase64}" alt="" />`;
  return initialsFor(user.displayName);
}
function avatarBg(user) { return user.photoBase64 ? 'transparent' : colorForName(user.displayName || '?'); }
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function timeAgoLabel(ts) {
  if (!ts) return '';
  const diffMs = Date.now() - ts.toDate().getTime();
  const mins = Math.floor(diffMs / 60000);
  if (mins < 1) return 'এইমাত্র';
  if (mins < 60) return mins + ' মিনিট আগে';
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + ' ঘণ্টা আগে';
  const days = Math.floor(hrs / 24);
  return days + ' দিন আগে';
}
function shortTime(ts) {
  if (!ts) return '';
  return new Date(ts.toDate()).toLocaleTimeString('bn-BD', { hour: '2-digit', minute: '2-digit' });
}

/* ---------------- Auth ---------------- */
function toggleAuthMode() {
  isSignupMode = !isSignupMode;
  document.getElementById('displayNameField').style.display = isSignupMode ? 'block' : 'none';
  document.getElementById('photoPickerRow').style.display = isSignupMode ? 'flex' : 'none';
  document.getElementById('authSubmitBtn').textContent = isSignupMode ? 'সাইন আপ করুন' : 'লগইন করুন';
  document.getElementById('authSwitchLabel').innerHTML = isSignupMode
    ? 'আগে থেকেই অ্যাকাউন্ট আছে? <a onclick="toggleAuthMode()">লগইন করুন</a>'
    : 'অ্যাকাউন্ট নেই? <a onclick="toggleAuthMode()">সাইন আপ করুন</a>';
  document.getElementById('authError').textContent = '';
}

function onSignupPhotoSelected(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const SIZE = 120;
      const canvas = document.createElement('canvas');
      canvas.width = SIZE; canvas.height = SIZE;
      const ctx = canvas.getContext('2d');
      const scale = Math.max(SIZE / img.width, SIZE / img.height);
      const w = img.width * scale, h = img.height * scale;
      ctx.drawImage(img, (SIZE - w) / 2, (SIZE - h) / 2, w, h);
      pendingSignupPhoto = canvas.toDataURL('image/jpeg', 0.7);
      document.getElementById('signupPhotoPreview').innerHTML = `<img src="${pendingSignupPhoto}" style="width:100%;height:100%;object-fit:cover;" />`;
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

async function submitAuth() {
  const email = document.getElementById('emailField').value.trim();
  const password = document.getElementById('passwordField').value;
  const errEl = document.getElementById('authError');
  errEl.textContent = '';
  if (!email || !password) { errEl.textContent = 'ইমেইল ও পাসওয়ার্ড দিন'; return; }

  try {
    if (isSignupMode) {
      const displayName = document.getElementById('displayNameField').value.trim();
      if (!displayName) { errEl.textContent = 'আপনার নাম দিন'; return; }
      const cred = await auth.createUserWithEmailAndPassword(email, password);
      await db.collection('users').doc(cred.user.uid).set({
        displayName, email, uid: cred.user.uid,
        photoBase64: pendingSignupPhoto || null,
        online: true,
        lastSeen: firebase.firestore.FieldValue.serverTimestamp(),
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    } else {
      await auth.signInWithEmailAndPassword(email, password);
    }
  } catch (e) {
    errEl.textContent = friendlyAuthError(e.code);
  }
}

function friendlyAuthError(code) {
  const map = {
    'auth/email-already-in-use': 'এই ইমেইল দিয়ে আগেই অ্যাকাউন্ট আছে',
    'auth/invalid-email': 'ইমেইল ঠিক নেই',
    'auth/weak-password': 'পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে',
    'auth/user-not-found': 'এই ইমেইলে কোনো অ্যাকাউন্ট নেই',
    'auth/wrong-password': 'ভুল পাসওয়ার্ড',
    'auth/invalid-credential': 'ইমেইল বা পাসওয়ার্ড ভুল',
  };
  return map[code] || 'কিছু একটা ভুল হয়েছে, আবার চেষ্টা করুন';
}

async function setPresence(online) {
  if (!currentUser) return;
  try {
    await db.collection('users').doc(currentUser.uid).update({
      online, lastSeen: firebase.firestore.FieldValue.serverTimestamp()
    });
  } catch (e) {}
}

function startHeartbeat() {
  setPresence(true);
  heartbeatInterval = setInterval(() => setPresence(true), 20000);
  window.addEventListener('beforeunload', () => setPresence(false));
  document.addEventListener('visibilitychange', () => setPresence(document.visibilityState === 'visible'));
}
function stopHeartbeat() {
  if (heartbeatInterval) clearInterval(heartbeatInterval);
}

function logout() {
  if (messagesUnsub) messagesUnsub();
  if (convDocUnsub) convDocUnsub();
  if (usersUnsub) usersUnsub();
  if (conversationsUnsub) conversationsUnsub();
  setPresence(false);
  stopHeartbeat();
  auth.signOut();
}

auth.onAuthStateChanged(async (user) => {
  if (user) {
    const doc = await db.collection('users').doc(user.uid).get();
    currentUser = { uid: user.uid, ...doc.data() };
    showScreen('contactsScreen');
    startHeartbeat();
    listenContacts();
  } else {
    currentUser = null;
    showScreen('authScreen');
  }
});

/* ---------------- Contacts (real-time: users + conversations) ---------------- */
function listenContacts() {
  if (usersUnsub) usersUnsub();
  if (conversationsUnsub) conversationsUnsub();

  usersUnsub = db.collection('users').onSnapshot(snap => {
    allUsers = snap.docs.map(d => d.data()).filter(u => u.uid !== currentUser.uid);
    renderContactList();
  });

  conversationsUnsub = db.collection('conversations')
    .where('participants', 'array-contains', currentUser.uid)
    .onSnapshot(snap => {
      myConversations = {};
      snap.docs.forEach(d => { myConversations[d.id] = d.data(); });
      renderContactList();
    });
}

function renderContactList() {
  const listEl = document.getElementById('contactList');
  if (allUsers.length === 0) {
    listEl.innerHTML = '<div class="empty-state">এখনো অন্য কেউ সাইন আপ করেননি। পরিবারের অন্যদের এই অ্যাপে অ্যাকাউন্ট বানাতে বলুন।</div>';
    return;
  }
  const rows = allUsers.map(u => {
    const convId = conversationIdFor(currentUser.uid, u.uid);
    const conv = myConversations[convId];
    const preview = conv ? (conv.lastMessageType === 'image' ? '📷 ছবি' : (conv.lastMessageText || '')) : 'চ্যাট শুরু করুন';
    const previewPrefixed = conv && conv.lastMessageSenderId === currentUser.uid ? 'আপনি: ' + preview : preview;
    const unread = conv && conv.unreadCount && conv.unreadCount[currentUser.uid] ? conv.unreadCount[currentUser.uid] : 0;
    const sortKey = conv && conv.lastUpdated ? conv.lastUpdated.toMillis() : 0;
    return { u, convId, previewPrefixed, unread, timeLabel: conv ? timeAgoLabel(conv.lastUpdated) : '', sortKey };
  }).sort((a, b) => b.sortKey - a.sortKey);

  listEl.innerHTML = rows.map(r => `
    <div class="contact-row" onclick='openChat(${JSON.stringify(r.u)})'>
      <div class="avatar-wrap">
        <div class="avatar" style="background:${avatarBg(r.u)}">${avatarHtml(r.u)}</div>
        ${r.u.online ? '<div class="online-dot"></div>' : ''}
      </div>
      <div class="contact-main">
        <div class="contact-top-row">
          <div class="contact-name">${r.u.displayName}</div>
          <div class="contact-time">${r.timeLabel}</div>
        </div>
        <div class="contact-bottom-row">
          <div class="contact-sub">${escapeHtml(r.previewPrefixed)}</div>
          ${r.unread > 0 ? `<div class="unread-badge">${r.unread}</div>` : ''}
        </div>
      </div>
    </div>
  `).join('');
}

function conversationIdFor(uidA, uidB) { return [uidA, uidB].sort().join('_'); }

/* ---------------- Chat ---------------- */
function goToContacts() {
  if (messagesUnsub) { messagesUnsub(); messagesUnsub = null; }
  if (convDocUnsub) { convDocUnsub(); convDocUnsub = null; }
  if (typingTimeout) clearTimeout(typingTimeout);
  if (activeConversationId) setTyping(false);
  activeConversationId = null;
  activePartner = null;
  clearImagePreview();
  showScreen('contactsScreen');
}

function openChat(partner) {
  activePartner = partner;
  activeConversationId = conversationIdFor(currentUser.uid, partner.uid);
  document.getElementById('chatPartnerName').textContent = partner.displayName;
  const avatarEl = document.getElementById('chatAvatar');
  avatarEl.style.background = avatarBg(partner);
  avatarEl.innerHTML = avatarHtml(partner);
  document.getElementById('messagesEl').innerHTML = '';
  updatePartnerStatusLabel(partner);
  showScreen('chatScreen');

  // reset my unread count for this conversation
  db.collection('conversations').doc(activeConversationId).set({
    unreadCount: { [currentUser.uid]: 0 }
  }, { merge: true }).catch(() => {});

  if (messagesUnsub) messagesUnsub();
  messagesUnsub = db.collection('conversations').doc(activeConversationId)
    .collection('messages').orderBy('timestamp', 'asc')
    .onSnapshot(snap => {
      const el = document.getElementById('messagesEl');
      el.innerHTML = snap.docs.map(d => renderMessage(d.data(), d.id)).join('');
      el.scrollTop = el.scrollHeight;
      markIncomingAsSeen(snap.docs);
    });

  if (convDocUnsub) convDocUnsub();
  convDocUnsub = db.collection('conversations').doc(activeConversationId).onSnapshot(doc => {
    const data = doc.data();
    const typingEl = document.getElementById('typingIndicator');
    if (data && data.typing && data.typing[partner.uid]) {
      typingEl.style.display = 'block';
    } else {
      typingEl.style.display = 'none';
    }
  });
}

function updatePartnerStatusLabel(partner) {
  const statusEl = document.getElementById('chatPartnerStatus');
  const live = allUsers.find(u => u.uid === partner.uid) || partner;
  statusEl.textContent = live.online ? 'অনলাইন' : (live.lastSeen ? 'শেষ সক্রিয়: ' + timeAgoLabel(live.lastSeen) : '');
}

async function markIncomingAsSeen(docs) {
  const batch = db.batch();
  let any = false;
  docs.forEach(d => {
    const m = d.data();
    if (m.senderId !== currentUser.uid && !m.seen) {
      batch.update(d.ref, { seen: true });
      any = true;
    }
  });
  if (any) { try { await batch.commit(); } catch (e) {} }
}

function renderMessage(m, docId) {
  const mine = m.senderId === currentUser.uid;
  const time = shortTime(m.timestamp);
  let inner = '';
  if (m.deleted) {
    inner += `<div style="font-style:italic;opacity:0.7;">এই মেসেজটি মুছে ফেলা হয়েছে</div>`;
  } else {
    if (m.text) inner += `<div>${escapeHtml(m.text)}</div>`;
    if (m.imageUrl) inner += `<img src="${m.imageUrl}" alt="photo" />`;
  }
  const ticks = mine ? `<span class="ticks ${m.seen ? 'seen' : ''}">${m.seen ? '✓✓' : '✓'}</span>` : '';
  const deleteBtn = (mine && !m.deleted) ? `<button class="delete-msg-btn" onclick="deleteMessage('${docId}')" title="মুছুন">🗑</button>` : '';
  return `<div class="msg-row ${mine ? 'mine' : ''}">
            ${deleteBtn}
            <div class="bubble ${mine ? 'mine' : 'theirs'}">${inner}<div class="meta-row"><span class="time">${time}</span>${ticks}</div></div>
          </div>`;
}

async function deleteMessage(docId) {
  if (!confirm('এই মেসেজটি মুছে ফেলতে চান?')) return;
  await db.collection('conversations').doc(activeConversationId)
    .collection('messages').doc(docId).update({ deleted: true });
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

/* ---------------- Typing indicator ---------------- */
function onTyping() {
  if (!activeConversationId) return;
  setTyping(true);
  if (typingTimeout) clearTimeout(typingTimeout);
  typingTimeout = setTimeout(() => setTyping(false), 3000);
}
async function setTyping(isTyping) {
  if (!activeConversationId) return;
  try {
    await db.collection('conversations').doc(activeConversationId).set({
      typing: { [currentUser.uid]: isTyping }
    }, { merge: true });
  } catch (e) {}
}

/* ---------------- Images ---------------- */
function onImageSelected(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const MAX_W = 800;
      const scale = Math.min(1, MAX_W / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      pendingImageDataUrl = canvas.toDataURL('image/jpeg', 0.6);
      document.getElementById('imgPreviewThumb').src = pendingImageDataUrl;
      document.getElementById('imgPreviewBar').style.display = 'flex';
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function clearImagePreview() {
  pendingImageDataUrl = null;
  document.getElementById('imageInput').value = '';
  document.getElementById('imgPreviewBar').style.display = 'none';
}

/* ---------------- Send ---------------- */
async function sendMessage() {
  const input = document.getElementById('messageInput');
  const text = input.value.trim();
  if (!text && !pendingImageDataUrl) return;

  const sendBtn = document.getElementById('sendBtn');
  sendBtn.disabled = true;

  try {
    if (pendingImageDataUrl && pendingImageDataUrl.length > 900000) {
      alert('ছবিটা এখনো একটু বড়, দয়া করে অন্য একটা ছবি চেষ্টা করুন');
      sendBtn.disabled = false;
      return;
    }

    const isImage = !!pendingImageDataUrl;
    await db.collection('conversations').doc(activeConversationId).set({
      participants: [currentUser.uid, activePartner.uid],
      lastUpdated: firebase.firestore.FieldValue.serverTimestamp(),
      lastMessageText: text || null,
      lastMessageType: isImage ? 'image' : 'text',
      lastMessageSenderId: currentUser.uid,
      typing: { [currentUser.uid]: false },
      unreadCount: { [activePartner.uid]: firebase.firestore.FieldValue.increment(1) }
    }, { merge: true });

    await db.collection('conversations').doc(activeConversationId).collection('messages').add({
      senderId: currentUser.uid,
      text: text || null,
      imageUrl: pendingImageDataUrl || null,
      timestamp: firebase.firestore.FieldValue.serverTimestamp(),
      seen: false
    });

    input.value = '';
    clearImagePreview();
    if (typingTimeout) clearTimeout(typingTimeout);
  } catch (e) {
    console.error('sendMessage error:', e);
    alert('মেসেজ পাঠাতে সমস্যা হয়েছে: ' + (e && e.message ? e.message : 'আবার চেষ্টা করুন'));
  } finally {
    sendBtn.disabled = false;
  }
}
</script>
